# =============================================================================
# MDN-Core Paper Configuration
# =============================================================================
# INSTALL: Place at plugins/mdn-core/config.yml on every Paper server.
# TIP: Use Pterodactyl File Manager or SFTP to upload.

database:
  # ── CHANGE THESE to match your Pterodactyl MySQL server ──
  host: "127.0.0.1"
  port: 3306
  database: "minedrop"
  username: "mdn_user"
  password: "secure_password"
  # ── Connection pool tuning (leave defaults unless you have 50+ players) ──
  pool-settings:
    maximum-pool-size: 10
    minimum-idle: 2
    connection-timeout-ms: 30000
    idle-timeout-ms: 600000

redis:
  # ── CHANGE THIS to match your Pterodactyl Redis server ──
  host: "127.0.0.1"
  port: 6379
  password: ""
  connection-timeout-ms: 2000
  pubsub-channel: "mdn_packet_bus"

network:
  # ── CHANGE per server! lobby/sam-public/sam-clan/unknown ──
  server-group: "lobby"
  save-interval-seconds: 300

commands:
  hub: true
  lobby: true
  spawn: true
  website: true
  store: true
  vote: true
  discord: true
  help: true
  rules: true

routing:
  region-enabled: false
  default-region: "EU"
