# =============================================================================
# MDN-Bridge Velocity Configuration
# =============================================================================
# INSTALL: Place at plugins/mdn-bridge/config.yml on Velocity proxy.
# The secret-api-key MUST match the key in all Paper server configs.

bridge:
  # Unique identifier for this Velocity proxy
  server-identity: "velocity-proxy-01"

  # ── CHANGE: same shared secret as Paper servers ──
  secret-api-key: "CHANGE-ME-generate-with-openssl-rand-base64-32"

  # How long to wait for Paper handshake confirmation
  handshake-timeout-seconds: 10

  # Number of retry attempts before declaring failure
  handshake-retries: 3
