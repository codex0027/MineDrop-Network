# =============================================================================
# MDN-Auth Configuration
# =============================================================================
# Handles password-based authentication, device fingerprinting, staff 2FA,
# alt account detection, session management, and account administration.

# ── Redis connection ──
redis:
  host: "127.0.0.1"
  port: 6379
  password: ""

# ── MySQL connection (for account persistence) ──
mysql:
  host: "127.0.0.1"
  port: 3306
  database: "minedrop"
  user: "mdn_user"
  password: ""

# ── Authentication settings ──
auth:

  # Password policy
  password:
    # Minimum password length (recommended: 12 per OWASP)
    min-length: 12
    # Maximum password length
    max-length: 128
    # Whether to require password authentication in cracked/offline mode
    require-in-cracked-mode: true

  # Session settings
  session:
    # Session TTL in seconds (default: 30 minutes)
    ttl-seconds: 1800
    # Duplicate login policy: new-authenticated-session-replaces-old
    duplicate-policy: "REPLACE_OLD"

  # Alt account detection
  alt-detection:
    max-accounts-per-ip: 3
    max-accounts-per-fingerprint: 2
    action: "KICK"  # KICK, ALERT, or SHADOW_BAN

  # Staff two-factor authentication
  staff-2fa:
    enabled: true
    # Lock the session to the IP that authenticated
    enforce-ip-lock: true
    # The issuer name shown in authenticator apps
    totp-issuer: "MineDropNetwork"
    # Permission groups that REQUIRE 2FA before playing
    force-for-permissions:
      - "mdn.group.admin"
      - "mdn.group.staff"

  # Private lobby service-secret validation
  private-lobbies:
    token-lifetime-seconds: 60
    secret-hashing-algorithm: "SHA-256"

  # Login timeout: disconnect unauthenticated players after this many seconds
  login-timeout-seconds: 120
