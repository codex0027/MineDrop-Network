# =============================================================================
# MDN-Bridge Paper Configuration
# =============================================================================
# INSTALL: Place at plugins/mdn-bridge/config.yml on every Paper server.
# IMPORTANT: Each server MUST have a unique server-identity.
#            The secret-api-key MUST match across ALL servers (including Velocity).

bridge:
  # ── CHANGE: unique name per server (e.g., paper-lobby-01, paper-game1-01) ──
  server-identity: "paper-lobby-01"

  # ── CHANGE: shared secret — same key on ALL Paper + Velocity servers ──
  # Generate one with: openssl rand -base64 32
  secret-api-key: "CHANGE-ME-generate-with-openssl-rand-base64-32"

  # How long to wait for Velocity's handshake response
  handshake-timeout-seconds: 10

  # SHA-256 hashes of allowed plugin builds (leave empty for development)
  allowed-build-hashes: []

# ── What happens when a plugin fails signature verification ──
verification-failure:
  # Options: SHUTDOWN, DISABLE_PLUGIN, WARN_STAFF
  action: "SHUTDOWN"
  # Discord webhook for security alerts (optional)
  alert-webhook: ""

# ── Developer setting ──
# WARNING: Only works on localhost (127.0.0.1). Rejected on public IPs.
debug-mode: false
