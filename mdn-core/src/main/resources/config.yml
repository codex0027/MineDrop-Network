# =============================================================================
# MDN-Core Paper Configuration
# =============================================================================
# INSTALL: Place at plugins/mdn-core/config.yml on every Paper server.
# TIP: Use Pterodactyl File Manager or SFTP to upload.

database:
  # ── CHANGE THESE to match your Pterodactyl MySQL server ──
  host: "127.0.0.1"
  port: 3306
  database: "minedrop"
  username: "mdn_user"
  password: "secure_password"
  # ── Connection pool tuning (leave defaults unless you have 50+ players) ──
  pool-settings:
    maximum-pool-size: 10
    minimum-idle: 2
    connection-timeout-ms: 30000
    idle-timeout-ms: 600000

redis:
  # ── CHANGE THIS to match your Pterodactyl Redis server ──
  host: "127.0.0.1"
  port: 6379
  password: ""
  connection-timeout-ms: 2000
  pubsub-channel: "mdn_packet_bus"

network:
  # ── CHANGE per server! lobby/sam-public/sam-clan/unknown ──
  server-group: "lobby"
  save-interval-seconds: 300

commands:
  hub: true
  lobby: true
  spawn: true
  website: true
  store: true
  vote: true
  discord: true
  help: true
  rules: true

routing:
  region-enabled: false
  default-region: "EU"

# ── Lobby Authentication Freeze (spec §84, §11-24) ──
# Freezes players who haven't authenticated via Velocity/MDN-Auth.
# They spawn at the auth location, can look around, but cannot move,
# interact, take damage, use inventory, or execute non-auth commands.
authentication:
  enabled: true

  # ── Where unauthenticated players spawn ──
  spawn:
    world: "world"
    x: 0.5
    y: 100.0
    z: 0.5
    yaw: 180.0
    pitch: 0.0

  # ── Freeze behavior ──
  freeze:
    # Allow the player to look around (yaw/pitch) while frozen?
    allow-look: true

  # ── Seconds before an unauthenticated player is kicked ──
  timeout-seconds: 120

  # ── Commands allowed while unauthenticated ──
  allowed-commands:
    - "register"
    - "login"
    - "password"
    - "2fa"
    - "help"

  # ── Show a title on join ──
  show-title: true

  # ── Chat messages shown to unauthenticated players ──
  messages:
    registered: "§eThis account is registered.\n§fPlease authenticate using: §a/login <password>"
    new-player: "§eThis Minecraft account is not registered.\n§fRegister using: §a/register <password>"
    totp-required: "§ePassword accepted. Two-factor authentication is required:\n§a/2fa verify <code>"
